[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-provenance-engine"
version = "0.1.0"
description = "Local text provenance signal detection engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Text Provenance Engine contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
hf = ["torch>=2.0", "transformers>=4.46"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]

[project.scripts]
provenance = "provenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
