services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://provenance:provenance_secret@db:5432/provenance}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PROVENANCE_MAX_BACKGROUND_JOBS: ${PROVENANCE_MAX_BACKGROUND_JOBS:-2}
      PROVENANCE_JOB_RETENTION_HOURS: ${PROVENANCE_JOB_RETENTION_HOURS:-24}
      PROVENANCE_ANON_COOKIE_SECRET: ${PROVENANCE_ANON_COOKIE_SECRET:-}
      PROVENANCE_ANON_COOKIE_SECURE: ${PROVENANCE_ANON_COOKIE_SECURE:-0}
      PROVENANCE_ANON_COOKIE_DOMAIN: ${PROVENANCE_ANON_COOKIE_DOMAIN:-}
      PROVENANCE_COOKIE_SAMESITE: ${PROVENANCE_COOKIE_SAMESITE:-lax}
      PROVENANCE_PUBLIC_DAILY_LIMIT: ${PROVENANCE_PUBLIC_DAILY_LIMIT:-2}
      PROVENANCE_PUBLIC_MAX_CHARS: ${PROVENANCE_PUBLIC_MAX_CHARS:-5000}
      PROVENANCE_FREE_DAILY_LIMIT: ${PROVENANCE_FREE_DAILY_LIMIT:-50}
      PROVENANCE_FREE_MAX_CHARS: ${PROVENANCE_FREE_MAX_CHARS:-20000}
      PROVENANCE_PRO_DAILY_LIMIT: ${PROVENANCE_PRO_DAILY_LIMIT:-1000}
      PROVENANCE_PRO_MAX_CHARS: ${PROVENANCE_PRO_MAX_CHARS:-100000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
