version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://provenance:provenance_secret@db:5432/provenance
      CORS_ORIGINS: http://localhost:5173
      PROVENANCE_MAX_BACKGROUND_JOBS: "2"
      PROVENANCE_JOB_RETENTION_HOURS: "24"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
